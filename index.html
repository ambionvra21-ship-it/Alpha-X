<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Devilmycry666 - V-1 Workspace</title>
    <!-- CSS Stylesheet link -->
    <link rel="stylesheet" href="assets/css/styles.css">
    <!-- Font Awesome for clean tool UI iconography -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

    <header class="app-header">
        <h1><i class="fa-solid fa-terminal"></i> DEVILMYCRY666 <span class="version-tag">V-1</span></h1>
        <p class="subtitle">Mobile-Optimized Multi-Utility Control Panel</p>
    </header>

    <main class="workspace-grid">
        
        <!-- MODULE 1: EXPENSE TRACKER & BUDGET CHARTS -->
        <section class="widget-card" id="expense-tracker">
            <div class="card-header">
                <h2><i class="fa-solid fa-wallet"></i> Expense Tracker</h2>
                <div class="currency-selector">
                    <select id="currency-select">
                        <option value="PHP">₱ PHP</option>
                        <option value="USD">$ USD</option>
                        <option value="EUR">€ EUR</option>
                    </select>
                </div>
            </div>
            <div class="card-body">
                <form id="expense-form" onsubmit="event.preventDefault();">
                    <input type="text" id="exp-title" placeholder="Item description" required>
                    <input type="number" id="exp-amount" placeholder="Amount" step="0.01" required>
                    <button type="submit" class="btn-primary"><i class="fa-solid fa-plus"></i> Add</button>
                </form>
                <div class="list-container">
                    <ul id="expense-list" class="utility-list">
                        <!-- Simulated template entry showing edit/delete layout actions -->
                        <li class="list-item">
                            <span>Sample Log</span>
                            <span class="amount-tag">₱150.00</span>
                            <div class="action-buttons">
                                <button class="btn-icon edit-btn" title="Edit"><i class="fa-solid fa-pen"></i></button>
                                <button class="btn-icon delete-btn" title="Delete"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </section>

        <!-- MODULE 2: QUICK SNIPPETS & CLIPBOARD MANAGER -->
        <section class="widget-card" id="clipboard-manager">
            <div class="card-header">
                <h2><i class="fa-solid fa-clipboard"></i> Quick Snippets</h2>
            </div>
            <div class="card-body">
                <div class="quick-tags">
                    <button class="tag-btn" onclick="navigator.clipboard.writeText('Hello World!');">Code Boilerplate</button>
                    <button class="tag-btn" onclick="navigator.clipboard.writeText('Best regards,\nUser');">Sign-off Template</button>
                </div>
                <textarea id="snippet-input" placeholder="Paste custom items to hold in temporary workspace..."></textarea>
                <button class="btn-secondary w-100"><i class="fa-solid fa-bookmark"></i> Hold Snippet</button>
            </div>
        </section>

        <!-- MODULE 3: AMBIENT BACKGROUND SOUND MACHINE -->
        <section class="widget-card" id="sound-machine">
            <div class="card-header">
                <h2><i class="fa-solid fa-sliders"></i> Ambient Sound Machine</h2>
            </div>
            <div class="card-body">
                <div class="audio-control-row">
                    <span><i class="fa-solid fa-cloud-rain"></i> Rainfall</span>
                    <button class="toggle-switch-btn" onclick="this.classList.toggle('active')">OFF</button>
                </div>
                <div class="audio-control-row">
                    <span><i class="fa-solid fa-wind"></i> White Noise</span>
                    <button class="toggle-switch-btn" onclick="this.classList.toggle('active')">OFF</button>
                </div>
            </div>
        </section>

        <!-- MODULE 4: SMART EMAIL & REPLY DRAFTER -->
        <section class="widget-card" id="email-drafter">
            <div class="card-header">
                <h2><i class="fa-solid fa-envelope-open-text"></i> Smart Email Drafter</h2>
            </div>
            <div class="card-body">
                <select id="email-tone" class="mb-2">
                    <option value="formal">Formal Professional</option>
                    <option value="casual">Casual Friendly</option>
                    <option value="urgent">Urgent Response</option>
                </select>
                <textarea id="email-context" placeholder="Core details or prompt bullet points..."></textarea>
                <button class="btn-primary w-100"><i class="fa-solid fa-wand-magic-sparkles"></i> Build Reply Structure</button>
            </div>
        </section>

        <!-- MODULE 5: INVOICE & QUOTE GENERATOR (WITH DOCUMENT LABELS) -->
        <section class="widget-card" id="invoice-generator">
            <div class="card-header">
                <h2><i class="fa-solid fa-file-invoice-dollar"></i> Invoice & Quote Generator</h2>
            </div>
            <div class="card-body">
                <input type="text" placeholder="Client Name" class="mb-2">
                <input type="number" placeholder="Total Quoted Bill" class="mb-2">
                <div class="export-options-grid">
                    <button class="export-btn pdf"><i class="fa-solid fa-file-pdf"></i> PDF</button>
                    <button class="export-btn word"><i class="fa-solid fa-file-word"></i> Word</button>
                    <button class="export-btn excel"><i class="fa-solid fa-file-excel"></i> Excel</button>
                </div>
            </div>
        </section>

    </main>

    <!-- App Engine JavaScript link -->
    <script src="assets/js/app.js"></script>
</body>
</html>
